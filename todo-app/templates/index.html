<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}}</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #263238;
      background: #f3f6f4;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 3rem 1rem; }
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    main {
      width: min(100%, 620px);
      margin: 0 auto;
      padding: 2rem;
      background: #fff;
      border: 1px solid #e1e9e4;
      border-radius: 16px;
      box-shadow: 0 12px 32px rgb(34 65 48 / 8%);
    }
    h1 { margin: 0 0 1.5rem; color: #245c43; font-size: 1.8rem; }
    .todo-form { display: flex; gap: .75rem; margin-bottom: 1.25rem; }
    .todo-input {
      min-width: 0;
      flex: 1;
      padding: .75rem 1rem;
      border: 1px solid #cbd9cf;
      border-radius: 8px;
      font: inherit;
    }
    .todo-input:focus { outline: 2px solid #78a68b; outline-offset: 2px; }
    .send-button {
      padding: .75rem 1.25rem;
      border: 0;
      border-radius: 8px;
      background: #245c43;
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .send-button:hover { background: #194832; }
    .send-button:disabled { background: #78a68b; cursor: wait; }
    .form-message { min-height: 1.25rem; margin: .25rem 0 .75rem; color: #a33; font-size: .9rem; }
    .empty-state { margin: 0; padding: 1rem; color: #6b7a70; text-align: center; }
    .todo-list { margin: 0; padding: 0; list-style: none; }
    .todo-item {
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: 1rem;
      border: 1px solid #e5ece7;
      border-radius: 10px;
      background: #fbfdfb;
    }
    .todo-item + .todo-item { margin-top: .75rem; }
    .todo-item.done span { color: #7d8b81; text-decoration: line-through; }
    .todo-item::before {
      width: 1.1rem;
      height: 1.1rem;
      flex: 0 0 auto;
      border: 2px solid #78a68b;
      border-radius: 50%;
      content: "";
    }
    .image-section { margin: 2rem 0; text-align: center; }
    .image-section h2 { margin: 0 0 .75rem; color: #52665a; font-size: 1rem; }
    img {
      display: block;
      width: min(100%, 280px);
      height: auto;
      margin: 0 auto;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgb(34 65 48 / 16%);
    }
    @media (max-width: 480px) {
      body { padding: 1.25rem .75rem; }
      main { padding: 1.25rem; }
      .todo-form { flex-direction: column; }
    }
  </style>
</head>
<body>
  <main>
    <h1>{{.Title}}</h1>
    <section class="image-section" aria-labelledby="image-title">
      <h2 id="image-title">A little inspiration</h2>
      <img src="/image" alt="Random Lorem Picsum image">
    </section>
    <form class="todo-form" id="todo-form">
      <label for="todo-input" class="visually-hidden">New todo</label>
      <input class="todo-input" id="todo-input" name="todo" type="text" maxlength="140" placeholder="Write a todo (max 140 characters)" required>
      <button class="send-button" type="submit">Send</button>
    </form>
    <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
    <ul class="todo-list" id="todo-list"></ul>
    <p class="empty-state" id="empty-state" hidden>No todos yet. Add one above.</p>
  </main>
  <script>
    const form = document.getElementById("todo-form");
    const input = document.getElementById("todo-input");
    const button = form.querySelector("button");
    const list = document.getElementById("todo-list");
    const emptyState = document.getElementById("empty-state");
    const message = document.getElementById("form-message");

    function showMessage(text) {
      message.textContent = text;
    }

    function renderTodos(todos) {
      list.replaceChildren();
      for (const todo of todos) {
        const item = document.createElement("li");
        item.className = "todo-item";
        if (todo.done) {
          item.classList.add("done");
        }
        const text = document.createElement("span");
        text.textContent = todo.text;
        item.append(text);
        list.append(item);
      }
      emptyState.hidden = todos.length > 0;
    }

    async function loadTodos() {
      const response = await fetch("/todos");
      if (!response.ok) {
        throw new Error("Could not load todos");
      }
      renderTodos(await response.json());
    }

    async function addTodo(text) {
      const response = await fetch("/todos", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text }),
      });
      if (!response.ok) {
        throw new Error("Could not create todo");
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) {
        return;
      }
      button.disabled = true;
      showMessage("");
      try {
        await addTodo(text);
        input.value = "";
        await loadTodos();
      } catch (error) {
        showMessage(error.message);
      } finally {
        button.disabled = false;
      }
    });

    loadTodos().catch((error) => showMessage(error.message));
  </script>
</body>
</html>
