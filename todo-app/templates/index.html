<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}}</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #263238;
      background: #f3f6f4;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 3rem 1rem; }
    main {
      width: min(100%, 620px);
      margin: 0 auto;
      padding: 2rem;
      background: #fff;
      border: 1px solid #e1e9e4;
      border-radius: 16px;
      box-shadow: 0 12px 32px rgb(34 65 48 / 8%);
    }
    h1 { margin: 0 0 1.5rem; color: #245c43; font-size: 1.8rem; }
    .todo-list { margin: 0; padding: 0; list-style: none; }
    .todo-item {
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: 1rem;
      border: 1px solid #e5ece7;
      border-radius: 10px;
      background: #fbfdfb;
    }
    .todo-item::before {
      width: 1.1rem;
      height: 1.1rem;
      flex: 0 0 auto;
      border: 2px solid #78a68b;
      border-radius: 50%;
      content: "";
    }
    .image-section { margin: 2rem 0; text-align: center; }
    .image-section h2 { margin: 0 0 .75rem; color: #52665a; font-size: 1rem; }
    img {
      display: block;
      width: min(100%, 280px);
      height: auto;
      margin: 0 auto;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgb(34 65 48 / 16%);
    }
    @media (max-width: 480px) {
      body { padding: 1.25rem .75rem; }
      main { padding: 1.25rem; }
    }
  </style>
</head>
<body>
  <main>
    <h1>{{.Title}}</h1>
    <section class="image-section" aria-labelledby="image-title">
      <h2 id="image-title">A little inspiration</h2>
      <img src="/image" alt="Random Lorem Picsum image">
    </section>
    <ul class="todo-list">
      <li class="todo-item">Your todo list starts here</li>
    </ul>
  </main>
</body>
</html>
