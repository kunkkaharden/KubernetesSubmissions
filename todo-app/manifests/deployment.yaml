apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      securityContext:
        fsGroup: 65532
      containers:
        - name: todo-app
          image: ghcr.io/kunkkaharden/todo-app:0.5
          imagePullPolicy: Always
          env:
          - name: PORT
            value: "3000"
          - name: IMAGE_CACHE_DIR
            value: /data
          volumeMounts:
          - name: image-cache
            mountPath: /data
      volumes:
      - name: image-cache
        persistentVolumeClaim:
          claimName: todo-app-image-cache
