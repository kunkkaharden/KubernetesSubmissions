apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
  namespace: project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      securityContext:
        fsGroup: 65532
      containers:
        - name: todo-app
          image: registry-docker-registry-ui-registry.registry.svc.cluster.local:5000/todo-app:1.2
          imagePullPolicy: Always
          envFrom:
          - configMapRef:
              name: todo-app-config
          volumeMounts:
          - name: image-cache
            mountPath: /data
      volumes:
      - name: image-cache
        persistentVolumeClaim:
          claimName: todo-app-image-cache
