apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      containers:
        - name: log-writer
          image: ghcr.io/kunkkaharden/log-output:1.1
          imagePullPolicy: IfNotPresent
          env:
            - name: ROLE
              value: "writer"
            - name: LOG_FILE
              value: "/data/log.txt"
          volumeMounts:
            - name: log-data
              mountPath: /data
        - name: log-reader
          image: ghcr.io/kunkkaharden/log-output:1.1
          imagePullPolicy: IfNotPresent
          env:
            - name: ROLE
              value: "server"
            - name: LOG_FILE
              value: "/data/log.txt"
            - name: PINGPONG_URL
              value: "http://ping-pong-svc:3000/pings"
            - name: PORT
              value: "3000"
          volumeMounts:
            - name: log-data
              mountPath: /data
      volumes:
        - name: log-data
          persistentVolumeClaim:
            claimName: shared-data