apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: ping-pong
              topologyKey: kubernetes.io/hostname
      containers:
        - name: log-writer
          image: ghcr.io/kunkkaharden/log-output:0.3
          imagePullPolicy: IfNotPresent
          env:
            - name: ROLE
              value: "writer"
            - name: LOG_FILE
              value: "/data/log.txt"
          volumeMounts:
            - name: log-data
              mountPath: /data
        - name: log-reader
          image: ghcr.io/kunkkaharden/log-output:0.4
          imagePullPolicy: IfNotPresent
          env:
            - name: ROLE
              value: "server"
            - name: LOG_FILE
              value: "/data/log.txt"
            - name: PINGPONG_FILE
              value: "/data/pingpong.txt"
            - name: PORT
              value: "3000"
          volumeMounts:
            - name: log-data
              mountPath: /data
      volumes:
        - name: log-data
          persistentVolumeClaim:
            claimName: shared-data