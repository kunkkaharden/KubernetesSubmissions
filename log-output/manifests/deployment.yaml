apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      containers:
        - name: log-writer
          image: ghcr.io/kunkkaharden/log-output:1.2
          imagePullPolicy: IfNotPresent
          env:
            - name: ROLE
              value: "writer"
            - name: LOG_FILE
              value: "/data/log.txt"
          volumeMounts:
            - name: log-data
              mountPath: /data
        - name: log-reader
          image: ghcr.io/kunkkaharden/log-output:1.2
          imagePullPolicy: IfNotPresent
          env:
            - name: ROLE
              value: "server"
            - name: LOG_FILE
              value: "/data/log.txt"
            - name: PINGPONG_URL
              value: "http://ping-pong-svc:3000/pings"
            - name: PORT
              value: "3000"
            - name: MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: log-output-config
                  key: MESSAGE
          volumeMounts:
            - name: log-data
              mountPath: /data
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: log-data
          persistentVolumeClaim:
            claimName: shared-data
        - name: config
          configMap:
            name: log-output-config
            items:
              - key: information.txt
                path: information.txt