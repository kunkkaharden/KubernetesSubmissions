{{- if .Values.registry.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "docker-registry-ui.fullname" . }}-registry
  labels:
    {{- include "docker-registry-ui.componentLabels" (list . "registry") | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.registry.persistence.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.registry.persistence.size }}
{{- end }}
