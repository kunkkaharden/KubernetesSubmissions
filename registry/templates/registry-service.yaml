apiVersion: v1
kind: Service
metadata:
  name: {{ include "docker-registry-ui.fullname" . }}-registry
  labels:
    {{- include "docker-registry-ui.componentLabels" (list . "registry") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.registry.service.port }}
      targetPort: registry
      protocol: TCP
      name: registry
  selector:
    {{- include "docker-registry-ui.componentLabels" (list . "registry") | nindent 4 }}
