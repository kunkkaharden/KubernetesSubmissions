apiVersion: v1
kind: Service
metadata:
  name: {{ include "docker-registry-ui.fullname" . }}-ui
  labels:
    {{- include "docker-registry-ui.componentLabels" (list . "ui") | nindent 4 }}
spec:
  type: {{ .Values.ui.service.type }}
  ports:
    - port: {{ .Values.ui.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "docker-registry-ui.componentLabels" (list . "ui") | nindent 4 }}
