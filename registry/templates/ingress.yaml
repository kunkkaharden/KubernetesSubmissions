{{- if .Values.ui.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "docker-registry-ui.fullname" . }}-ui
  labels:
    {{- include "docker-registry-ui.componentLabels" (list . "ui") | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ui.ingress.className }}
  rules:
    - host: {{ .Values.ui.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "docker-registry-ui.fullname" . }}-ui
                port:
                  number: {{ .Values.ui.service.port }}
{{- end }}
