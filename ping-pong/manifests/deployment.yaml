apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-pong
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong
  template:
    metadata:
      labels:
        app: ping-pong
    spec:
      containers:
        - name: ping-pong
          image: ghcr.io/kunkkaharden/ping-pong:0.2
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "3000"
            - name: COUNTER_FILE
              value: "/data/pingpong.txt"
          volumeMounts:
            - name: shared-data
              mountPath: /data
      volumes:
        - name: shared-data
          persistentVolumeClaim:
            claimName: shared-data
