name: Todo app CI/CD

on:
  push:
    branches:
      - master
    paths:
      - "todo-app/**"
      - "todo-stack/todo-app/**"
      - ".github/workflows/todo-app.yml"

permissions:
  contents: read

jobs:
  changes:
    runs-on: kubernetes-submissions
    outputs:
      todo_app: ${{ steps.filter.outputs.todo_app }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            todo_app:
              - 'todo-app/**'
              - 'todo-stack/todo-app/**'

  build-todo-app:
    needs: changes
    if: needs.changes.outputs.todo_app == 'true'
    runs-on: kubernetes-submissions
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v6
        with:
          context: ./todo-app
          push: true
          tags: registry-docker-registry-ui-registry.registry.svc.cluster.local:5000/todo-app:${{ github.sha }}

  deploy-todo-app:
    needs: [changes, build-todo-app]
    if: needs.changes.outputs.todo_app == 'true'
    runs-on: kubernetes-submissions
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0
      - uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: 5.4.2
      - name: Deploy todo-app
        env:
          IMAGE_TAG: registry-docker-registry-ui-registry.registry.svc.cluster.local:5000/todo-app:${{ github.sha }}
        run: |-
          cd todo-stack/todo-app
          kustomize edit set image registry-docker-registry-ui-registry.registry.svc.cluster.local:5000/todo-app=$IMAGE_TAG
          kustomize build . | kubectl apply -f -
          kubectl rollout status deployment/todo-app --namespace project
          kubectl get services --namespace project -o wide
